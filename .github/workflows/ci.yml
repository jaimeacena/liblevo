name: Calidad

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust y app Tauri en Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Preparar Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Interfaz (tipos y compilación)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm --prefix ui ci
          npm --prefix ui run build
      - name: Formato, lint y pruebas
        env:
          CARGO_BUILD_JOBS: "4"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.97.0 test --locked --workspace --all-targets
          cargo +1.97.0 build --release --locked --workspace --bins

  herramientas:
    name: Herramientas Python y EPUBCheck 5.3.0
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Instalar herramientas
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install "psutil==7.2.2" "pypdfium2==5.12.1" "ruff==0.15.22"
      - name: Estilo de los scripts
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m ruff check .
          python -m ruff format --check .
      - name: EPUB de muestra con EPUBCheck
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Invoke-WebRequest -Uri "https://github.com/w3c/epubcheck/releases/download/v5.3.0/epubcheck-5.3.0.zip" -OutFile "$env:RUNNER_TEMP\epubcheck.zip"
          Expand-Archive "$env:RUNNER_TEMP\epubcheck.zip" "$env:RUNNER_TEMP\epubcheck"
          $pdfium = python -c "import pathlib, pypdfium2_raw; print(pathlib.Path(pypdfium2_raw.__file__).parent / 'pdfium.dll')"
          cargo +1.97.0 run --release --locked -p liblevo-worker --bin liblevo-convert -- $pdfium sin-lector sin-modelos eval/muestras/epub-muestra.md "$env:RUNNER_TEMP\salida"
          java -jar "$env:RUNNER_TEMP\epubcheck\epubcheck-5.3.0\epubcheck.jar" "$env:RUNNER_TEMP\salida\document.epub"
