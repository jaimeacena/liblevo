[workspace]
members = ["native/liblevo-core", "native/liblevo-worker", "native/liblevo-eval", "app"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
